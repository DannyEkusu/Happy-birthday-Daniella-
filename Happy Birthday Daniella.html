<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Daniella 🎂</title>
<style>
:root{
  --plum:#2b1055; --violet:#5b2a9e; --pink:#ff5fa8; --peach:#ffb38a;
  --gold:#ffd86b; --mint:#7ee8d0; --sky:#7fb8ff; --cream:#fff6ee;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0; min-height:100%; overflow:hidden; position:relative;
  display:flex; align-items:center; justify-content:center;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color:var(--cream);
  background:linear-gradient(135deg,#2b1055,#6a2c9c,#d4478f,#ff9a8b,#6a2c9c,#2b1055);
  background-size:400% 400%;
  animation:bgshift 22s ease-in-out infinite;
}
@keyframes bgshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* soft light blobs */
body::before,body::after{
  content:""; position:fixed; width:60vmax; height:60vmax; border-radius:50%;
  filter:blur(60px); opacity:.35; pointer-events:none; z-index:0;
  animation:drift 18s ease-in-out infinite alternate;
}
body::before{background:var(--pink); top:-25vmax; left:-20vmax}
body::after{background:var(--sky); bottom:-28vmax; right:-22vmax; animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

.layer{position:fixed; inset:0; overflow:hidden; pointer-events:none}
.back{z-index:1}
.front{z-index:3}

/* balloons */
.b{
  position:absolute; left:var(--l); bottom:-30vh;
  width:var(--sz); height:calc(var(--sz)*1.22);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 8%,transparent 22%),var(--c);
  border-radius:50% 50% 48% 48%/58% 58% 42% 42%;
  opacity:.85;
  animation:rise var(--d) linear var(--s) infinite;
}
.b::before{
  content:""; position:absolute; left:50%; top:100%; width:2px; height:calc(var(--sz)*1.1);
  background:linear-gradient(rgba(255,255,255,.55),transparent); transform:translateX(-50%);
}
.b::after{
  content:""; position:absolute; left:50%; top:calc(100% - 3px); width:10px; height:8px;
  background:var(--c); transform:translateX(-50%); clip-path:polygon(50% 0,100% 100%,0 100%);
}
@keyframes rise{
  0%{transform:translate(0,0) rotate(-3deg)}
  25%{transform:translate(18px,-35vh) rotate(3deg)}
  50%{transform:translate(-14px,-75vh) rotate(-3deg)}
  75%{transform:translate(16px,-115vh) rotate(3deg)}
  100%{transform:translate(0,-160vh) rotate(-2deg)}
}

/* confetti */
.c{
  position:absolute; top:-6vh; left:var(--l); width:var(--w); height:calc(var(--w)*.55);
  background:var(--c); border-radius:2px; opacity:.9;
  animation:fall var(--d) linear var(--s) infinite;
}
.c.r{border-radius:50%; height:var(--w)}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0)}
  50%{transform:translate3d(24px,55vh,0) rotate(280deg)}
  100%{transform:translate3d(-18px,112vh,0) rotate(600deg)}
}

/* sparkles + hearts */
.sp{
  position:absolute; left:var(--l); top:var(--t); font-size:var(--f,1.2rem);
  animation:twinkle var(--d) ease-in-out var(--s) infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0; transform:scale(.4) rotate(0)}
  50%{opacity:1; transform:scale(1) rotate(25deg)}
}
.h{
  position:absolute; left:var(--l); bottom:-8vh; font-size:var(--f,1.4rem); opacity:0;
  animation:float var(--d) ease-in var(--s) infinite;
}
@keyframes float{
  0%{opacity:0; transform:translate(0,0) scale(.7)}
  15%{opacity:.9}
  50%{transform:translate(20px,-50vh) scale(1)}
  100%{opacity:0; transform:translate(-14px,-108vh) scale(1.1)}
}

/* the card */
.card{
  position:relative; z-index:2; width:min(92vw,620px);
  margin:16px; padding:clamp(28px,6vw,56px) clamp(18px,5vw,48px) clamp(28px,5vw,44px);
  text-align:center; border-radius:32px;
  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.07));
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 30px 80px rgba(20,0,50,.45),inset 0 1px 0 rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  animation:cardin 1.2s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes cardin{from{opacity:0; transform:translateY(40px) scale(.94)}to{opacity:1; transform:none}}

.cake{
  display:block; font-size:clamp(5rem,22vw,8.5rem); line-height:1;
  filter:drop-shadow(0 0 22px rgba(255,216,107,.7));
  animation:bob 3.6s ease-in-out infinite, pop 1s cubic-bezier(.3,1.6,.5,1) .3s both;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes pop{from{opacity:0; scale:.2}to{opacity:1; scale:1}}

h1{
  margin:.35em 0 0; font-weight:900; line-height:1.02;
  font-family:Impact,"Arial Black","Trebuchet MS",sans-serif;
  font-size:clamp(2.3rem,11vw,4.6rem); letter-spacing:.04em;
  background:linear-gradient(90deg,var(--gold),#fff,var(--peach),#fff,var(--gold));
  background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 14px rgba(255,95,168,.55));
  animation:shine 6s linear infinite, rise-in 1.1s cubic-bezier(.2,.9,.3,1) .5s both;
}
@keyframes shine{to{background-position:-250% 0}}
@keyframes rise-in{from{opacity:0; transform:translateY(24px); letter-spacing:.2em}to{opacity:1; transform:none; letter-spacing:.04em}}

.name{
  display:block; margin:.1em 0 0;
  font-family:"Snell Roundhand","Segoe Script","Brush Script MT","Lucida Handwriting",cursive;
  font-size:clamp(3rem,15vw,6rem); font-weight:700; line-height:1.15; color:var(--cream);
  animation:glow 3.2s ease-in-out infinite, rise-in 1.1s cubic-bezier(.2,.9,.3,1) .8s both;
}
@keyframes glow{
  0%,100%{text-shadow:0 0 10px rgba(255,255,255,.5),0 0 28px rgba(255,95,168,.6)}
  50%{text-shadow:0 0 18px rgba(255,255,255,.9),0 0 46px rgba(255,216,107,.85)}
}

.msg{
  margin:1.2em auto 0; max-width:30ch; font-size:clamp(1rem,4.2vw,1.2rem); line-height:1.6;
  color:rgba(255,246,238,.95); text-shadow:0 1px 8px rgba(43,16,85,.6);
  animation:fade 1.2s ease 1.3s both;
}
@keyframes fade{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

.wish{
  display:inline-block; margin-top:1.6em; padding:.9em 2em; border-radius:999px;
  font-weight:700; font-size:clamp(1rem,4.4vw,1.15rem); color:#4a1650; cursor:default;
  background:linear-gradient(135deg,var(--gold),var(--peach) 55%,var(--pink));
  box-shadow:0 8px 26px rgba(255,95,168,.5),inset 0 2px 0 rgba(255,255,255,.6);
  position:relative; overflow:hidden;
  animation:fade 1.2s ease 1.6s both, pulse 2.8s ease-in-out 2.8s infinite;
}
.wish::after{
  content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);
  transform:skewX(-20deg); animation:sweep 3.5s ease-in-out 3s infinite;
}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

@media (max-width:480px){
  .card{border-radius:26px}
  .b:nth-child(n+7){display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important}
  .b,.c,.h{display:none}
}
</style>
</head>
